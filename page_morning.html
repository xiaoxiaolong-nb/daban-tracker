<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌅 早盘板块异动监测</title>
<style>
  :root{--bg:#0f1115;--panel:#16181d;--line:#262a32;--txt:#e6e6e6;--muted:#9aa0aa;--pos:#ff4d4f;--neg:#2ecc71;--gold:#ffc53d;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;padding:14px 16px 40px;}
  a{color:inherit;text-decoration:none;}
  .topbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .topbar a{padding:6px 12px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;}
  .topbar a.active{background:#22314a;border-color:#3b5b8c;color:#fff;}
  h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .ws-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .ws-ok{background:var(--neg);box-shadow:0 0 6px var(--neg);}
  .ws-bad{background:#666;}
  .icon-btn{margin-left:auto;background:#1d2129;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .icon-btn:hover{border-color:#3b5b8c;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--neg);display:inline-block;margin-right:4px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .panel-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hint{font-size:11px;color:var(--muted);font-weight:400;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:8px 6px;text-align:center;border-bottom:1px solid #1e2229;}
  th{color:var(--muted);font-weight:500;font-size:12px;}
  tbody tr:hover{background:#1b1f27;}
  .pos{color:var(--pos);}
  .neg{color:var(--neg);}
  .muted{color:#555;}
  .empty{color:var(--muted);text-align:center;padding:18px 0;font-size:12px;}
  .rk{display:inline-flex;width:18px;height:18px;border-radius:5px;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#232833;color:#9aa0aa;}
  .rk1{background:#5a1e1e;color:#ff8a80;}
  .rk2{background:#5a441e;color:#ffd479;}
  .rk3{background:#1e3a5a;color:#82b1ff;}
  .nm{font-weight:600;}
  .cd{color:var(--muted);font-size:12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#1b1f27;border:1px solid #262a32;border-radius:7px;padding:3px 8px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap;}
  .chip .cd{font-size:11px;}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">🐉 龙回头</a>
  <a href="/page/firstboard">📋 首板次日池</a>
  <a href="/page/leader">🐉 板块龙头速览</a>
  <a href="/page/morning" class="active">🌅 早盘监测</a>
</div>

<h1>🌅 早盘监测 <span class="ws-dot ws-bad" id="ws-dot"></span>
  <button class="icon-btn" id="refresh">🔄 刷新</button>
</h1>
<div class="sub"><span class="live-dot"></span> 实时监测 · <span id="update-time">加载中…</span></div>

<div class="panel">
  <div class="panel-title">🔥 板块异动 <span class="hint">按涨幅排序 · 前 8 · 领涨股 TOP3</span></div>
  <div id="sec-move"><div class="empty">加载中…</div></div>
</div>

<div class="panel">
  <div class="panel-title">📡 异动股 TOP3 <span class="hint">盘中自动扫描：涨幅≥3% + 量比≥1.8 + 成交≥5000万</span></div>
  <div id="alerts"><div class="empty">暂无个股异动…（盘中每 30 秒扫描一次）</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script>
let _alerts=[], _socket=null;

function fmtTime(){ return new Date().toLocaleTimeString('zh-CN',{hour12:false}); }

function renderSectorMove(list){
  const rows=(list||[]).slice().sort((a,b)=>(b.chg_pct||0)-(a.chg_pct||0)).slice(0,8);
  const box=document.getElementById('sec-move');
  if(!rows.length){ box.innerHTML='<div class="empty">暂无数据</div>'; return; }
  box.innerHTML='<table><thead><tr><th>板块</th><th>涨幅</th><th>领涨股 TOP3</th></tr></thead><tbody>'
    + rows.map((s,i)=>{
        const p=s.chg_pct||0;
        const rk = i<3?('rk rk'+(i+1)):'rk';
        let ls=(s.leaders&&s.leaders.length)?s.leaders:((s.leader_name)?[{name:s.leader_name,code:'',chg:s.leader_chg}]:[]);
        const chips = ls.slice(0,3).map(g=>{
          const c=g.chg||0;
          return '<span class="chip"><span class="nm">'+g.name+'</span>'
            + (g.code?'<span class="cd">'+g.code+'</span>':'')
            + '<span class="'+(c>=0?'pos':'neg')+'">'+(c>=0?'+':'')+c.toFixed(2)+'%</span></span>';
        }).join('') || '<span class="muted">—</span>';
        return '<tr>'
          +'<td style="white-space:nowrap"><span class="'+rk+'">'+(i+1)+'</span> <span class="nm">'+s.name+'</span></td>'
          +'<td style="white-space:nowrap"><span class="'+(p>=0?'pos':'neg')+'">'+(p>=0?'+':'')+p.toFixed(2)+'%</span></td>'
          +'<td style="text-align:left">'+chips+'</td>'
          +'</tr>';
      }).join('')+'</tbody></table>';
}

function renderAlerts(){
  const box=document.getElementById('alerts');
  if(!_alerts.length){ box.innerHTML='<div class="empty">暂无个股异动…（盘中每 30 秒扫描一次）</div>'; return; }
  const top=_alerts.slice().sort((a,b)=>(b.change_pct||0)-(a.change_pct||0)).slice(0,3);
  box.innerHTML='<table><thead><tr><th>#</th><th>名称</th><th>代码</th><th>涨幅</th><th>量比</th><th>成交额</th><th>时间</th></tr></thead><tbody>'
    + top.map((a,i)=>{
        const p=a.change_pct||0;
        return '<tr>'
          +'<td><span class="rk rk'+(i+1)+'">'+(i+1)+'</span></td>'
          +'<td class="nm" style="text-align:left">'+ (a.name||'') +'</td>'
          +'<td class="cd">'+ (a.code||'') +'</td>'
          +'<td><span class="'+(p>=0?'pos':'neg')+'">'+(p>=0?'+':'')+p.toFixed(2)+'%</span></td>'
          +'<td>'+(a.vol_ratio!=null?a.vol_ratio.toFixed(2):'—')+'</td>'
          +'<td>'+ (a.amount!=null?(a.amount/10000).toFixed(2)+'亿':'—') +'</td>'
          +'<td class="cd">'+ (a.time||'') +'</td>'
          +'</tr>';
      }).join('')+'</tbody></table>';
}

function loadSectors(){
  fetch('/api/market/sector_leaders').then(r=>r.json()).then(d=>{
    renderSectorMove(d.data||[]);
    document.getElementById('update-time').textContent='板块数据 '+fmtTime();
  }).catch(()=>{});
}

function loadAlerts(){
  fetch('/api/sniper/alerts').then(r=>r.json()).then(d=>{
    const live=(d.alerts||[]).slice().reverse();  // 旧→新
    const seen={};
    _alerts=[];
    live.forEach(a=>{ if(!seen[a.code]){seen[a.code]=1;_alerts.push(a);} });
    renderAlerts();
  }).catch(()=>{});
}

function initSocket(){
  try{
    _socket=io('http://127.0.0.1:5000',{transports:['websocket']});
    _socket.on('connect',()=>document.getElementById('ws-dot').className='ws-dot ws-ok');
    _socket.on('disconnect',()=>document.getElementById('ws-dot').className='ws-dot ws-bad');
    _socket.on('sniper_alert',a=>{
      _alerts.unshift(a);
      if(_alerts.length>30)_alerts.pop();
      renderAlerts();
      if(window.Notification && Notification.permission==='granted'){
        try{ new Notification('📡 异动 '+(a.name||''),{body:(a.change_pct>0?'+':'')+a.change_pct+'% 量比'+a.vol_ratio}); }catch(e){}
      }
    });
  }catch(e){}
}

document.getElementById('refresh').onclick=()=>{ loadSectors(); loadAlerts(); };

initSocket();
loadSectors();
loadAlerts();
setInterval(loadSectors, 30000);
setInterval(loadAlerts, 30000);
</script>
</body>
</html>
