<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打板信号追踪器</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,'Microsoft YaHei',sans-serif;margin:0;background:#0f1115;color:#e6e6e6;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9aa0aa;font-size:13px;margin-bottom:14px}
  .cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .card{background:#1a1d24;border:1px solid #2a2e38;border-radius:10px;padding:12px 14px;min-width:130px}
  .card .k{font-size:12px;color:#9aa0aa}
  .card .v{font-size:19px;font-weight:700;margin-top:4px}
  form{background:#1a1d24;border:1px solid #2a2e38;border-radius:10px;padding:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  input,select,button{background:#0f1115;border:1px solid #2a2e38;color:#e6e6e6;border-radius:8px;padding:8px 10px;font-size:14px}
  button{cursor:pointer;background:#2f6fed;border-color:#2f6fed;color:#fff}
  button:hover{opacity:.9}
  #refresh{background:#2a2e38;border-color:#2a2e38}
  .stsel{font-size:12px;padding:3px 6px;border:1px solid #2a2e38;border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid #23262f;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:#9aa0aa;font-weight:600;position:sticky;top:0;background:#0f1115}
  .del{cursor:pointer;color:#ff4d4f}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#2a2e38;font-size:12px}
  .pending{color:#6b7280}
  .note{color:#9aa0aa;font-size:12px;margin-top:6px}
  .pos{color:#ff4d4f}.neg{color:#00c853}
  .wrap{overflow-x:auto}
  .pin-btn{background:transparent;border:none;cursor:pointer;font-size:18px;padding:0;line-height:1}
  .pin-btn:hover{transform:scale(1.2)}
  .pinned-row{background:#2a2310 !important}
  .pinned-row td:first-child{box-shadow:inset 3px 0 0 #ffaa00}
  .up{color:#ff4d4f}.down{color:#00c853}.mid{color:#e6e6e6}
  .card .v small{font-size:11px;font-weight:400;color:#9aa0aa}
  .sec-title{font-size:14px;color:#9aa0aa;margin:6px 0 2px;font-weight:600}
</style>
</head>
<body>
<h1>📈 打板信号追踪器</h1>
<div class="sub">记录打板信号 → 自动跟踪未来走势 → 滚动测算成功率（数据：本机通达信 <code>C:\new_tdx\vipdoc</code>）<br>实时行情：<span id="qt-time">—</span> · <span id="qt-status">—</span>（每 30 秒自动刷新）</div>
<div class="sec-title">📊 市场情绪（全市场涨停/连板 · 不含ST · 最新完整交易日）</div>
<div class="cards" id="sentiment-cards"></div>
<div id="st-note" class="note"></div>

<!-- 我的持仓 -->
<div class="sec-title" style="margin-top:20px">💼 我的持仓（手动输入成本价，实时算盈亏）</div>
<div id="portfolio-stats" class="cards" style="margin-bottom:8px"></div>
<form id="pf" style="background:#1a1d24;border:1px solid #2a2e38;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
  <div><div style="font-size:12px;color:#9aa0aa;margin-bottom:4px">股票代码</div><input id="pf-code" placeholder="600519" style="width:100px"></div>
  <div><div style="font-size:12px;color:#9aa0aa;margin-bottom:4px">持仓股数</div><input id="pf-shares" type="number" placeholder="1000" style="width:90px"></div>
  <div><div style="font-size:12px;color:#9aa0aa;margin-bottom:4px">成本价（元）</div><input id="pf-cost" type="number" step="0.001" placeholder="10.50" style="width:90px"></div>
  <button type="submit" style="background:#0a6e2a;border-color:#0a6e2a">＋ 添加持仓</button>
</form>
<div class="wrap"><table id="pf-tbl" style="font-size:13px">
  <thead><tr><th>代码</th><th>名称</th><th>股数</th><th>成本价</th><th>现价</th><th>最新涨跌%</th><th>市值</th><th>盈亏额</th><th>盈亏%</th><th></th></tr></thead>
  <tbody></tbody>
</table></div>
<div class="cards" id="cards"></div>
<form id="f">
  <div><div class="k" style="font-size:12px;color:#9aa0aa;margin-bottom:4px">股票代码</div><input id="code" placeholder="600519 / 300750 / sz000001" style="width:190px"></div>
  <div><div class="k" style="font-size:12px;color:#9aa0aa;margin-bottom:4px">信号日</div><input id="date" type="date"></div>
  <div><div class="k" style="font-size:12px;color:#9aa0aa;margin-bottom:4px">指标</div>
    <select id="ind"><option>双龙打板</option><option>龙头打板</option><option>起爆</option><option>二合一共振</option><option>三合一共振</option><option>自定义</option></select></div>
  <div><div class="k" style="font-size:12px;color:#9aa0aa;margin-bottom:4px">备注</div><input id="note" placeholder="可选" style="width:140px"></div>
  <button type="submit">＋ 记录信号</button>
  <button type="button" id="refresh">↻ 刷新（重算未来走势）</button>
  <button type="button" id="rescan">📊 盘后重算市场情绪（约2分钟）</button>
  <span id="rescan-status" style="color:#9aa0aa;font-size:12px;align-self:center"></span>
</form>
<div class="wrap"><table id="tbl">
  <thead><tr><th>置顶</th><th>代码</th><th>名称</th><th>信号日</th><th>指标</th><th>实时价</th><th>实时涨跌%</th><th>实时%</th><th>次日开盘%</th><th>T+1%</th><th>T+2%</th><th>T+3%</th><th>T+5%</th><th>T+10%</th><th>状态</th><th>备注</th><th></th></tr></thead>
  <tbody></tbody>
</table></div>
<script>
const fmt = v => v==null ? '<span class="pending">—</span>' : (v>=0?'<span class="pos">+'+v+'</span>':'<span class="neg">'+v+'</span>');
function setStatus(sel){
  fetch('/api/signals/'+sel.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:sel.value})}).then(r=>{if(r.ok)colorize(sel);});
}
function colorize(sel){
  const map={'观察中':'#7a5a00','已止盈':'#0a6e2a','已止损':'#7a1a1a','忽略':'#3a3d45'};
  sel.style.background = map[sel.value]||'#1a1d24';
  sel.style.color = sel.value==='忽略'?'#aaa':'#fff';
}
function loadSentiment(){
  fetch('/api/market/sentiment').then(r=>r.json()).then(d=>{
    const el=document.getElementById('sentiment-cards');
    if(!el) return;
    if(d.error){ el.innerHTML='<div class="note">市场情绪数据未生成（盘后运行 market_sentiment.py）</div>'; return; }
    const L=d.latest, P=d.prev, A=d.avg_20;
    const f=v=>v==null?'<span class="pending">—</span>':v;
    const up=v=>v==null?'<span class="pending">—</span>':(v>=50?'<span class="up">'+v+'%</span>':(v<50?'<span class="down">'+v+'%</span>':'<span class="mid">'+v+'%</span>'));
    const el2=v=>v==null?'<span class="pending">—</span>':(v>=25?`<span class="pos">${v}%</span>`:`<span class="neg">${v}%</span>`);
    // —— 头部：封板 / 炸板 / 跌停 ——
    let h='';
    const mk=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    h+=mk('今日封板('+L.date+')', `<span class="${L.limit_up>=100?'up':'mid'}">${L.limit_up}</span>`);
    h+=mk('今日炸板', `<span class="${L.zhangting>=50?'up':(L.zhangting<=20?'down':'mid')}">${L.zhangting}</span>`);
    h+=mk('今日跌停', `<span class="${L.limit_down>=50?'down':(L.limit_down>=20?'mid':'down')}">${L.limit_down}</span>`);
    // —— 连板梯度 ——
    h+=mk('最高板数', L.max_board+'板');
    h+=mk('1板（首板）', L.first_board);
    h+=mk('2板（连板）', L.second_board);
    h+=mk('3板+', L.third_board+(L.fourth_board||0)+(L.fifth_board||0));
    // —— 晋级率（数据窗口动态标注）——
    const avgN = d.trading_days||'';
    const avgLbl = avgN ? `(${avgN}日均` : '(日均';
    h+=mk('1进2 晋级率', `${el2(L.adv_12)} <small>${avgLbl} ${A.adv_12}%)</small>`);
    h+=mk('2进3 晋级率', `${el2(L.adv_23)} <small>${avgLbl} ${A.adv_23}%)</small>`);
    h+=mk('3进4 晋级率', `${el2(L.adv_34)} <small>${avgLbl} ${A.adv_34}%)</small>`);
    // —— 昨日参考 ——
    if(P){ h+=mk('昨日封板('+P.date+')', P.limit_up); h+=mk('昨日炸板', P.zhangting); }
    el.innerHTML=h;
    const note=document.getElementById('st-note');
    const src = d.source||'通达信 .day 文件';
    if(note){
      const days_note = d.trading_days ? `（数据窗口约${d.trading_days}天，历史均值供参考）` : '';
      note.textContent = `数据源：${src} | 已剔除 ST/*ST ${d.st_excluded||0} 只 | ${days_note}`;
    }
  }).catch(e=>{});
}

function startRescan(){
  const btn=document.getElementById('rescan');
  const st=document.getElementById('rescan-status');
  btn.disabled=true;
  st.textContent='启动中…';
  fetch('/api/market/rescan',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.status==='running'){ st.textContent='已在重算中…'; pollRescan(btn,st); }
    else if(d.status==='started'){ pollRescan(btn,st); }
    else { btn.disabled=false; st.textContent='启动失败: '+(d.msg||'未知'); }
  }).catch(e=>{ btn.disabled=false; st.textContent='请求失败'; });
}
function pollRescan(btn,st){
  fetch('/api/market/rescan/status').then(r=>r.json()).then(d=>{
    st.textContent = d.running ? ('重算中… '+d.progress) : ('✓ 完成 '+d.progress);
    if(d.running){ setTimeout(()=>pollRescan(btn,st), 3000); }
    else { btn.disabled=false; loadSentiment(); }
  }).catch(e=>{ btn.disabled=false; st.textContent='状态获取失败'; });
}
document.getElementById('rescan').onclick=startRescan;

function load(){
  loadSentiment();
  fetch('/api/signals').then(r=>r.json()).then(d=>{
    const s=d.stats, c=document.getElementById('cards');
    const card=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    let html='';
    ['next_open','T1','T2','T3','T5','T10'].forEach(k=>{
      const st=s[k]; if(!st||!st.count) return;
      const label = k==='next_open'?'次日开盘 胜/均':(k+' 胜/均');
      html+=card(label, st.win_rate+'% / '+st.mean+'%');
    });
    html+=card('信号总数', s.total);
    html+=card('已匹配数据', s.found);
    c.innerHTML=html;
    const tb=document.querySelector('#tbl tbody'); tb.innerHTML='';
    d.signals.sort((a,b)=>{
      const pa = a.pinned?1:0, pb = b.pinned?1:0;
      if(pa!==pb) return pb-pa;
      return String(b.date).replace(/-/g,'').localeCompare(String(a.date).replace(/-/g,''));
    });
    d.signals.forEach(it=>{
      const done = it.found && it.ret && it.ret.T10!=null;
      const tr=document.createElement('tr');
      tr.dataset.code = it.code;
      tr.dataset.status = it.status || '观察中';
      if(it.pinned) tr.classList.add('pinned-row');
      tr.innerHTML=`<td class="pin-cell"><button class="pin-btn ${it.pinned?'on':''}" data-id="${it.id}" title="${it.pinned?'取消置顶':'置顶'}">${it.pinned?'📌':'📍'}</button></td><td>${it.code}</td><td>${it.name||'—'}</td><td>${it.date}</td><td><span class="tag">${it.indicator||''}</span></td>
        <td class="live-price pending">—</td><td class="live-pct pending">—</td><td class="live-vs-sig pending" data-sig-close="${it.sig_close||0}">—</td>
        <td>${fmt(it.next_open)}</td><td>${fmt(it.ret?it.ret.T1:null)}</td><td>${fmt(it.ret?it.ret.T2:null)}</td><td>${fmt(it.ret?it.ret.T3:null)}</td>
        <td>${fmt(it.ret?it.ret.T5:null)}</td><td>${fmt(it.ret?it.ret.T10:null)}</td>
        <td><select class="stsel" data-id="${it.id}" onchange="setStatus(this)">
          <option ${it.status==='观察中'?'selected':''}>观察中</option>
          <option ${it.status==='已止盈'?'selected':''}>已止盈</option>
          <option ${it.status==='已止损'?'selected':''}>已止损</option>
          <option ${it.status==='忽略'?'selected':''}>忽略</option>
        </select></td><td>${it.note||''}</td>
        <td class="del" data-id="${it.id}">删除</td>`;
      tb.appendChild(tr);
    });
    tb.querySelectorAll('.del').forEach(e=>e.onclick=()=>{
      fetch('/api/signals/'+e.dataset.id,{method:'DELETE'}).then(load);
    });
    tb.querySelectorAll('.stsel').forEach(colorize);
    tb.querySelectorAll('.pin-btn').forEach(b=>b.onclick=()=>{
      const willPin = !b.classList.contains('on');
      fetch('/api/signals/'+b.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pinned:willPin})}).then(load);
    });
  });
}
document.getElementById('f').onsubmit=ev=>{
  ev.preventDefault();
  const code=document.getElementById('code').value;
  const date=document.getElementById('date').value;
  if(!code||!date){alert('请填代码和信号日');return;}
  fetch('/api/signals',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,date,indicator:document.getElementById('ind').value,note:document.getElementById('note').value})})
    .then(r=>r.json()).then(()=>{document.getElementById('code').value='';document.getElementById('note').value='';load();});
};
document.getElementById('refresh').onclick=load;
document.getElementById('date').value=new Date().toISOString().slice(0,10);
load();

async function refreshQuotes(){
  const rows = [...document.querySelectorAll('tr[data-code]')]
    .filter(r => { const s = r.dataset.status || ''; return s !== '已止盈' && s !== '已止损'; });
  const statusEl = document.getElementById('qt-status');
  const timeEl = document.getElementById('qt-time');
  if(timeEl) timeEl.textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  if(!rows.length){ if(statusEl) statusEl.textContent='无活跃信号'; return; }
  const codes = [...new Set(rows.map(r=>r.dataset.code))];
  try {
    const r = await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codes})});
    const quotes = await r.json();
    if(statusEl) statusEl.textContent = '✓ 已拉取 ' + Object.keys(quotes).length + '/' + codes.length + ' 只';
    rows.forEach(tr=>{
      const q = quotes[tr.dataset.code];
      const priceTd = tr.querySelector('.live-price');
      const pctTd = tr.querySelector('.live-pct');
      const vsSigTd = tr.querySelector('.live-vs-sig');
      const sigClose = parseFloat(vsSigTd?.dataset.sigClose) || 0;
      if(q){
        priceTd.textContent = q.price.toFixed(2);
        priceTd.classList.remove('pending');
        pctTd.classList.remove('pending');
        pctTd.innerHTML = q.change_pct==null?'—':(q.change_pct>=0?`<span class="pos">+${q.change_pct}%</span>`:`<span class="neg">${q.change_pct}%</span>`);
        if(sigClose > 0){
          const vs = (q.price / sigClose - 1) * 100;
          vsSigTd.classList.remove('pending');
          vsSigTd.innerHTML = vs>=0?`<span class="pos">+${vs.toFixed(2)}%</span>`:`<span class="neg">${vs.toFixed(2)}%</span>`;
        } else {
          vsSigTd.innerHTML = '—';
        }
      } else {
        priceTd.textContent = '—';
        pctTd.innerHTML = '—';
        vsSigTd.innerHTML = '—';
      }
    });
  } catch(e){
    if(statusEl) statusEl.textContent = '❌ ' + e.message;
    console.error('refreshQuotes failed:', e);
  }
}
refreshQuotes();
setInterval(refreshQuotes, 30000);

// ===== 持仓功能 =====
async function loadPortfolio(){
  const r = await fetch('/api/portfolio');
  const positions = await r.json();
  // 统计汇总
  const statsEl = document.getElementById('portfolio-stats');
  statsEl.innerHTML = `<div class="card"><div class="k">持仓股数</div><div class="v">${positions.length}</div></div>`;
  // 渲染表格
  const tb = document.querySelector('#pf-tbl tbody');
  tb.innerHTML = '';
  if(!positions.length){
    tb.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#9aa0aa;padding:16px">暂无持仓，添加第一只</td></tr>';
    return;
  }
  // 拉实时行情
  const codes = positions.map(p=>p.code);
  let quotes = {};
  try {
    const rq = await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codes})});
    quotes = await rq.json();
  } catch(e){}
  let totalCost=0,totalMkt=0;
  positions.forEach(p=>{
    const q = quotes[p.code]||{};
    const price = q.price||0;
    const chgPct = q.change_pct||0;
    const mkt = price * p.shares;
    const cost = p.cost * p.shares;
    const pnl = mkt - cost;
    const pnlPct = cost>0 ? (pnl/cost*100) : 0;
    totalCost += cost; totalMkt += mkt;
    const pnlClz = pnl>=0?'pos':'neg';
    const pnlStr = pnl>=0?'+'+pnl.toFixed(0):pnl.toFixed(0);
    const pnlPStr = pnlPct>=0?'+'+pnlPct.toFixed(2)+'%':pnlPct.toFixed(2)+'%';
    const chgStr = chgPct==null?'—':(chgPct>=0?'+'+chgPct.toFixed(2)+'%':chgPct.toFixed(2)+'%');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.code}</td><td>${p.name||'—'}</td><td>${p.shares.toLocaleString()}</td><td>${p.cost}</td>
      <td>${price>0?price.toFixed(2):'—'}</td>
      <td class="${chgPct>=0?'pos':'neg'}">${chgStr}</td>
      <td>${mkt>0?mkt.toLocaleString('zh-CN',{minimumFractionDigits:2}):'—'}</td>
      <td class="${pnlClz}">${pnlStr}</td>
      <td class="${pnlClz}">${pnlPStr}</td>
      <td class="del" data-code="${p.code}" style="cursor:pointer;color:#ff4d4f">删除</td>`;
    tb.appendChild(tr);
  });
  // 总览
  const totalPnl = totalMkt - totalCost;
  const totalPnlPct = totalCost>0 ? (totalPnl/totalCost*100) : 0;
  const tpnc = totalPnl>=0?'pos':'neg';
  const tpns = totalPnl>=0?'+'+totalPnl.toFixed(0):totalPnl.toFixed(0);
  const tpnps = totalPnlPct>=0?'+'+totalPnlPct.toFixed(2)+'%':totalPnlPct.toFixed(2)+'%';
  statsEl.innerHTML = `<div class="card"><div class="k">持仓</div><div class="v">${positions.length} 只</div></div>
    <div class="card"><div class="k">总市值</div><div class="v">${totalMkt.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div></div>
    <div class="card"><div class="k">总盈亏</div><div class="v ${tpnc}">${tpns} (${tpnps})</div></div>`;
  // 删除事件
  tb.querySelectorAll('.del').forEach(btn=>btn.onclick=()=>{
    fetch('/api/portfolio/'+btn.dataset.code,{method:'DELETE'}).then(loadPortfolio);
  });
}
document.getElementById('pf').onsubmit=ev=>{
  ev.preventDefault();
  const code=document.getElementById('pf-code').value.trim();
  const shares=parseFloat(document.getElementById('pf-shares').value);
  const cost=parseFloat(document.getElementById('pf-cost').value);
  if(!code||!shares||!cost){alert('请填代码/股数/成本价');return;}
  fetch('/api/portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,shares,cost})})
    .then(r=>r.json()).then(d=>{
      if(d.error) alert(d.error);
      else { document.getElementById('pf-code').value=''; document.getElementById('pf-shares').value=''; document.getElementById('pf-cost').value=''; loadPortfolio(); }
    });
};
// 首次加载
loadPortfolio();
// 每30秒刷新
setInterval(loadPortfolio, 30000);
</script>
</body>
</html>
